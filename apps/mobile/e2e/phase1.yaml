# Phase 1 journey (R10.1), one run in order, on the Android debug build against local Supabase with
# the fake payment provider. CI: .github/workflows/ci.yml (job e2e) after apps/mobile/e2e/fixture.sql.
appId: com.coachforall.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Get started'
    timeout: 300000

# 1. Onboarding: Categories → Interests → Levels → Who & where (D34, D35)
- tapOn: 'Get started'
- tapOn: 'Hobbies.*'
- tapOn: 'Continue'
- tapOn: 'Pottery'
- tapOn: 'Continue · 1 picked'
- assertVisible: 'How experienced are you?'
- tapOn: 'Beginner, .*'
- tapOn: 'Continue'
- assertVisible: 'Who are the sessions for?'
- tapOn: 'Me, .*'
- tapOn: 'Heliopolis'
- scrollUntilVisible:
    element: 'Show my picks'
    direction: DOWN
    centerElement: true
- tapOn: 'Show my picks'

# 2. Sign up and verify, landing on Home with the answers saved (D34, R11.2)
- assertVisible: 'Your phone number'
- tapOn: 'Your first name'
- inputText: 'Salma'
- tapOn: 'Phone number'
- inputText: '1009990001'
- hideKeyboard
- tapOn: 'Send code'
- assertVisible: 'Enter the code'
- inputText: '135790'
- extendedWaitUntil:
    visible: 'Good .*, Salma.*'
    timeout: 60000

# 3. Category tray
- tapOn: 'Category: Hobbies. Change category'
- tapOn: 'Sports'
- assertVisible: 'Category: Sports. Change category'
- tapOn: 'Category: Sports. Change category'
- tapOn: 'Hobbies'
- assertVisible: 'Category: Hobbies. Change category'

# 4 + 6. Book two workshop seats and pay by card (fake provider)
# Through Explore's Groups list (vertical, soonest first), so it doesn't depend on where the date
# puts it in Home's rail. No keyboard: the CI emulator's software GPU crashed opening it here.
- tapOn: 'Explore'
- tapOn: 'Groups'
- scrollUntilVisible:
    element: 'Wheel-throwing taster.*'
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: 'Wheel-throwing taster.*'
- extendedWaitUntil:
    visible: 'Pick a date'
    timeout: 30000
- takeScreenshot: e2e-output/group-page
- scrollUntilVisible:
    element: '2 seats'
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: '2 seats'
- tapOn: 'Reserve'
- assertVisible: 'Review & pay'
- tapOn: 'Pay [0-9,]+ EGP'
- tapOn:
    text: 'Allow'
    optional: true
- extendedWaitUntil:
    visible: "You're in."
    timeout: 60000
    optional: true
# If payment didn't go through, the error is at the foot of Review & pay: photograph it, then fail.
- runFlow:
    when:
      notVisible: "You're in."
    commands:
      - scroll
      - takeScreenshot: e2e-output/review-error
      - assertVisible: "You're in."
- scrollUntilVisible:
    element: 'Back to Home'
    direction: DOWN
    centerElement: true
- tapOn: 'Back to Home'

# 5 + 6. Book Dina's soonest 1:1 oud time and pay
- scrollUntilVisible:
    element: '.*Dina Samir.*'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: '.*Dina Samir.*'
- tapOn:
    text: '(Today|Tomorrow) \d\d:\d\d'
    index: 0
- tapOn: 'Continue'
- assertVisible: 'Review & pay'
- tapOn: 'Pay [0-9,]+ EGP'
- tapOn:
    text: 'Allow'
    optional: true
- extendedWaitUntil:
    visible: "You're in."
    timeout: 60000
- scrollUntilVisible:
    element: 'Back to Home'
    direction: DOWN
    centerElement: true
- tapOn: 'Back to Home'

# 7. Both in Bookings
- tapOn: 'Bookings'
- assertVisible: 'Wheel-throwing taster.*'
- assertVisible: 'Oud with Dina.*'

# 8. Cancel with refund: the workshop is three days out, paid by card
- tapOn: 'Wheel-throwing taster.*'
- scrollUntilVisible:
    element: 'Cancel booking'
    direction: DOWN
    centerElement: true
- tapOn: 'Cancel booking'
- assertVisible: "You'll get 1,300 EGP back.*"
- tapOn: 'Cancel and refund 1,300 EGP'
- assertVisible: 'Booking cancelled · 1,300 EGP on its way back'

# 9. Cancel without refund: the oud lesson starts within 24 h
- tapOn: 'Oud with Dina.*'
- scrollUntilVisible:
    element: 'Cancel booking'
    direction: DOWN
    centerElement: true
- tapOn: 'Cancel booking'
- assertVisible: "(Less than 24 hours to go|Same-day bookings are final).*"
- tapOn:
    text: 'Cancel booking'
    below: 'Keep booking'
- assertVisible: 'Booking cancelled'
